<style>
:root{--bg:#f6f1e7;--ink:#14213d;--sand:#d9c7a3;--muted:#4a5568;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.5;min-height:100vh;display:flex;justify-content:center;padding:max(40px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
main{width:100%;max-width:460px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--sand);display:block;margin:0 auto 18px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:32px;line-height:1.15;margin:0}
.sub{color:var(--muted);font-size:15px;margin:8px 0 30px}
.links{display:flex;flex-direction:column;gap:12px}
.link{--ib:var(--ink);--ig:#f0ead9;display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--ink);border-radius:4px;color:var(--ink);text-decoration:none;text-align:left;transition:transform .15s,background .15s}
.link.primary{--ib:var(--sand);--ig:var(--ink);background:var(--ink);color:#f0ead9}
.link:hover{transform:translateY(-1px)}
.link:not(.primary):hover{background:rgba(20,33,61,.06)}
.ico{flex:0 0 28px;width:28px;height:28px}
.ico .bg{fill:var(--ib)}
.ico .fg{fill:var(--ig)}
.ico .ray{stroke:var(--ig);stroke-width:1.6;stroke-linecap:round}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:16px}
.txt span{display:block;font-size:13px;opacity:.75}
.arrow{opacity:.6;font-size:18px}
footer{margin-top:34px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
</style>
